<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contato - Construtora Max</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contato.css" />
</head>
<body>
  <header>
    <div class="logo">Construtora Max</div>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="nossa-historia.html">Nossa História</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="carreiras.html">Carreiras</a></li>
        <li><a href="contato.html" style="text-decoration: underline;">Contato</a></li>
        <li><a href="carrinho.html">🛒 Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 class="titulo-contato">Entre em Contato</h2>
    <section>
      <form id="form-contato">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>

        <button type="submit" class="btn">Enviar</button>
      </form>
      <div class="success-message" id="mensagem-sucesso">Mensagem enviada com sucesso! Entraremos em contato em breve.</div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Construtora Max. Todos os direitos reservados.</p>
  </footer>

  <script>
    document.getElementById('form-contato').addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const mensagem = document.getElementById('mensagem').value.trim();
      const sucesso = document.getElementById('mensagem-sucesso');

      if (!nome || !email || !mensagem) {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      sucesso.style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
